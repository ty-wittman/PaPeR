<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="STIX Two Text, Times New Roman, serif" font-size="14" fill="#222">
  <rect width="760" height="440" fill="#ffffff"/>
  <!-- Panel (a): genotype index triangle for k = 4 -->
  <text x="20" y="24" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">(a) Genotype index, k = 4</text>
  <g font-size="13" text-anchor="middle">
    <text x="88" y="56">b = 1</text><text x="138" y="56">2</text><text x="188" y="56">3</text><text x="238" y="56">4</text>
    <text x="42" y="88" text-anchor="end">a = 1</text><text x="42" y="138" text-anchor="end">2</text><text x="42" y="188" text-anchor="end">3</text><text x="42" y="238" text-anchor="end">4</text>
  </g>
  <g stroke="#9aa5b1" stroke-width="1">
    <!-- row a=1 -->
    <rect x="63" y="63" width="50" height="40" fill="#dbe9f6"/><rect x="113" y="63" width="50" height="40" fill="#dbe9f6"/><rect x="163" y="63" width="50" height="40" fill="#dbe9f6"/><rect x="213" y="63" width="50" height="40" fill="#dbe9f6"/>
    <!-- row a=2 -->
    <rect x="63" y="113" width="50" height="40" fill="#f3f3f3"/><rect x="113" y="113" width="50" height="40" fill="#dbe9f6"/><rect x="163" y="113" width="50" height="40" fill="#dbe9f6"/><rect x="213" y="113" width="50" height="40" fill="#dbe9f6"/>
    <!-- row a=3 -->
    <rect x="63" y="163" width="50" height="40" fill="#f3f3f3"/><rect x="113" y="163" width="50" height="40" fill="#f3f3f3"/><rect x="163" y="163" width="50" height="40" fill="#dbe9f6"/><rect x="213" y="163" width="50" height="40" fill="#dbe9f6"/>
    <!-- row a=4 -->
    <rect x="63" y="213" width="50" height="40" fill="#f3f3f3"/><rect x="113" y="213" width="50" height="40" fill="#f3f3f3"/><rect x="163" y="213" width="50" height="40" fill="#f3f3f3"/><rect x="213" y="213" width="50" height="40" fill="#dbe9f6"/>
  </g>
  <g text-anchor="middle" font-size="16">
    <text x="88" y="89">0</text><text x="138" y="89">1</text><text x="188" y="89">2</text><text x="238" y="89">3</text>
    <text x="138" y="139">4</text><text x="188" y="139">5</text><text x="238" y="139">6</text>
    <text x="188" y="189">7</text><text x="238" y="189">8</text>
    <text x="238" y="239">9</text>
  </g>
  <text x="20" y="282" font-size="13">G = k(k+1)/2 = 10 unordered genotypes {a, b}, a ≤ b</text>

  <!-- Panel (b): a birth through gamete variables -->
  <text x="300" y="24" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">(b) A birth, factorized through alleles</text>
  <g stroke="#333" stroke-width="1.4" fill="none">
    <line x1="342" y1="80" x2="398" y2="80"/><line x1="426" y1="80" x2="472" y2="80"/>
    <line x1="342" y1="190" x2="398" y2="190"/><line x1="426" y1="190" x2="472" y2="190"/>
    <line x1="496" y1="88" x2="548" y2="128"/><line x1="496" y1="182" x2="548" y2="142"/>
    <line x1="576" y1="135" x2="620" y2="135"/>
  </g>
  <!-- variable nodes -->
  <g stroke="#1b4f8a" stroke-width="1.5" fill="#dbe9f6">
    <circle cx="324" cy="80" r="18"/><circle cx="324" cy="190" r="18"/><circle cx="638" cy="135" r="18"/>
  </g>
  <g stroke="#b26b00" stroke-width="1.5" fill="#fde7c8">
    <circle cx="484" cy="80" r="13"/><circle cx="484" cy="190" r="13"/>
  </g>
  <!-- factor nodes -->
  <g stroke="#333" stroke-width="1.4" fill="#ffffff">
    <rect x="398" y="68" width="28" height="24"/><rect x="398" y="178" width="28" height="24"/><rect x="548" y="121" width="28" height="28"/>
  </g>
  <g text-anchor="middle" font-size="15">
    <text x="324" y="85" font-style="italic">g<tspan font-size="11" dy="4">d</tspan></text>
    <text x="324" y="195" font-style="italic">g<tspan font-size="11" dy="4">s</tspan></text>
    <text x="638" y="140" font-style="italic">g<tspan font-size="11" dy="4">c</tspan></text>
    <text x="484" y="85" font-style="italic">x</text><text x="484" y="195" font-style="italic">y</text>
    <text x="412" y="85" font-style="italic" font-size="14">t</text><text x="412" y="195" font-style="italic" font-size="14">t</text>
    <text x="562" y="140" font-size="13">[ ]</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="324" y="118">dam, G states</text><text x="324" y="228">sire, G states</text>
    <text x="412" y="58">G × k</text><text x="412" y="168">G × k</text>
    <text x="484" y="58">allele, k</text><text x="484" y="222">allele, k</text>
    <text x="562" y="112">G × k²</text>
    <text x="645" y="172">child, G</text>
  </g>
  <text x="300" y="262" font-size="13">pairing [g<tspan font-size="10" dy="3">c</tspan><tspan dy="-3"> = {x, y}] has one non-zero cell per (x, y):</tspan></text>
  <text x="300" y="280" font-size="13">eliminating through it reads one term (a "select")</text>

  <!-- Panel (c): lane layout -->
  <text x="20" y="324" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">(c) One compiled program evaluates W = 4 loci with the same k at once</text>
  <g font-size="12" text-anchor="middle" fill="#444">
    <text x="86" y="348">cell 0</text><text x="246" y="348">cell 1</text><text x="406" y="348">cell 2</text><text x="566" y="348">cell 3</text><text x="700" y="348">…</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="22" y="356" width="32" height="30" fill="#1b4f8a"/><rect x="54" y="356" width="32" height="30" fill="#4f81bd"/><rect x="86" y="356" width="32" height="30" fill="#8fb3dc"/><rect x="118" y="356" width="32" height="30" fill="#c6d9ef"/>
    <rect x="182" y="356" width="32" height="30" fill="#1b4f8a"/><rect x="214" y="356" width="32" height="30" fill="#4f81bd"/><rect x="246" y="356" width="32" height="30" fill="#8fb3dc"/><rect x="278" y="356" width="32" height="30" fill="#c6d9ef"/>
    <rect x="342" y="356" width="32" height="30" fill="#1b4f8a"/><rect x="374" y="356" width="32" height="30" fill="#4f81bd"/><rect x="406" y="356" width="32" height="30" fill="#8fb3dc"/><rect x="438" y="356" width="32" height="30" fill="#c6d9ef"/>
    <rect x="502" y="356" width="32" height="30" fill="#1b4f8a"/><rect x="534" y="356" width="32" height="30" fill="#4f81bd"/><rect x="566" y="356" width="32" height="30" fill="#8fb3dc"/><rect x="598" y="356" width="32" height="30" fill="#c6d9ef"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="38" y="376" fill="#fff">ℓ1</text><text x="70" y="376" fill="#fff">ℓ2</text><text x="102" y="376">ℓ3</text><text x="134" y="376">ℓ4</text>
    <text x="198" y="376" fill="#fff">ℓ1</text><text x="230" y="376" fill="#fff">ℓ2</text><text x="262" y="376">ℓ3</text><text x="294" y="376">ℓ4</text>
    <text x="358" y="376" fill="#fff">ℓ1</text><text x="390" y="376" fill="#fff">ℓ2</text><text x="422" y="376">ℓ3</text><text x="454" y="376">ℓ4</text>
    <text x="518" y="376" fill="#fff">ℓ1</text><text x="550" y="376" fill="#fff">ℓ2</text><text x="582" y="376">ℓ3</text><text x="614" y="376">ℓ4</text>
  </g>
  <text x="20" y="410" font-size="13">Every table of the program is stored as cell × W + lane, with one scale per lane, so each multiply-add</text>
  <text x="20" y="428" font-size="13">is a single vector instruction across four loci (AVX2), or eight with AVX-512.</text>
</svg>
