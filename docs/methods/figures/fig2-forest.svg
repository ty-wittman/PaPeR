<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="STIX Two Text, Times New Roman, serif" font-size="14" fill="#222">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">(a) A pedigree with a loop</text>
  <text x="380" y="26" font-size="15" font-weight="bold">(b) Families, incidences and the spanning forest</text>

  <!-- (a) classical pedigree drawing -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="83" y1="80" x2="177" y2="80"/>            <!-- G1 = G2 mating line -->
    <line x1="130" y1="80" x2="130" y2="120"/>           <!-- descent -->
    <line x1="70" y1="120" x2="190" y2="120"/>           <!-- sibship line -->
    <line x1="70" y1="120" x2="70" y2="157"/><line x1="190" y1="120" x2="190" y2="157"/>
    <line x1="83" y1="170" x2="177" y2="170"/>           <!-- A = B mating line -->
    <line x1="130" y1="170" x2="130" y2="237"/>          <!-- descent to C -->
  </g>
  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <circle cx="70" cy="80" r="13"/><rect x="177" y="67" width="26" height="26"/>
    <circle cx="70" cy="170" r="13"/><rect x="177" y="157" width="26" height="26"/>
    <rect x="117" y="237" width="26" height="26"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="70" y="58">G1</text><text x="190" y="58">G2</text>
    <text x="40" y="175">A</text><text x="222" y="175">B</text>
    <text x="130" y="285">C</text>
  </g>
  <text x="20" y="320" font-size="13">A and B are full siblings and the parents of C,</text>
  <text x="20" y="338" font-size="13">so G1 and G2 reach C along two paths.</text>

  <!-- (b) bipartite incidence graph -->
  <line x1="360" y1="40" x2="360" y2="350" stroke="#ddd" stroke-width="1"/>
  <g stroke="#333" stroke-width="1.6">
    <line x1="470" y1="78" x2="540" y2="135"/>   <!-- G1 - f1 (d) -->
    <line x1="610" y1="78" x2="540" y2="135"/>   <!-- G2 - f1 (s) -->
    <line x1="540" y1="135" x2="470" y2="195"/>  <!-- f1 - A (c) -->
    <line x1="540" y1="135" x2="610" y2="195"/>  <!-- f1 - B (c) -->
    <line x1="470" y1="195" x2="540" y2="252"/>  <!-- A - f2 (d) -->
    <line x1="540" y1="252" x2="540" y2="305"/>  <!-- f2 - C (c) -->
  </g>
  <line x1="610" y1="195" x2="540" y2="252" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5"/>  <!-- B - f2 (s), CUT -->
  <g stroke="#333" stroke-width="1.5" fill="#ffffff">
    <circle cx="470" cy="78" r="13"/><rect x="597" y="65" width="26" height="26"/>
    <circle cx="470" cy="195" r="13"/><rect x="597" y="182" width="26" height="26"/>
    <rect x="527" y="305" width="26" height="26"/>
  </g>
  <g fill="#111"><circle cx="540" cy="135" r="6"/><circle cx="540" cy="252" r="6"/></g>
  <g font-size="14" text-anchor="middle">
    <text x="470" y="56">G1</text><text x="610" y="56">G2</text>
    <text x="440" y="200">A</text><text x="642" y="200">B</text><text x="540" y="352">C</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="574" y="139" text-anchor="start">family (G1, G2)</text>
    <text x="508" y="256" text-anchor="end">family (A, B)</text>
  </g>
  <g>
    <text x="492" y="101" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">d</text>
    <circle cx="508" cy="96" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="508" y="100" font-size="11" text-anchor="middle" fill="#1b4f8a">1</text>
    <text x="590" y="101" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">s</text>
    <circle cx="574" cy="96" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="574" y="100" font-size="11" text-anchor="middle" fill="#1b4f8a">2</text>
    <text x="492" y="171" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">c</text>
    <circle cx="508" cy="166" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="508" y="170" font-size="11" text-anchor="middle" fill="#1b4f8a">3</text>
    <text x="590" y="171" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">c</text>
    <circle cx="574" cy="166" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="574" y="170" font-size="11" text-anchor="middle" fill="#1b4f8a">4</text>
    <text x="489" y="231" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">d</text>
    <circle cx="505" cy="226" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="505" y="230" font-size="11" text-anchor="middle" fill="#1b4f8a">5</text>
    <text x="556" y="284" font-size="13" font-style="italic" fill="#1b4f8a" text-anchor="middle">c</text>
    <circle cx="572" cy="280" r="8" fill="#ffffff" stroke="#1b4f8a" stroke-width="1.2"/><text x="572" y="284" font-size="11" text-anchor="middle" fill="#1b4f8a">7</text>
    <text x="590" y="230" font-size="13" font-style="italic" fill="#c0392b" text-anchor="middle">s</text>
    <circle cx="574" cy="226" r="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="574" y="230" font-size="11" text-anchor="middle" fill="#c0392b">6</text>
    <text x="600" y="232" font-size="12" font-style="italic" fill="#c0392b">cut</text>
  </g>
  <text x="652" y="262" font-size="12" fill="#c0392b">B is already</text>
  <text x="652" y="277" font-size="12" fill="#c0392b">connected to</text>
  <text x="652" y="292" font-size="12" fill="#c0392b">family (A, B)</text>
</svg>
